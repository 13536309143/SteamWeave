<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
 <title id="title">SteamWeave</title><desc id="desc">Maintenance-aware multimodal prognostics. Numerical, visual, textual and temporal evidence connect to a supervised forecast.</desc>
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b34"/><stop offset="1" stop-color="#183c44"/></linearGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#91b4b8" stroke-opacity=".065"/></pattern><linearGradient id="wave"><stop stop-color="#75d0bd"/><stop offset="1" stop-color="#bde8d7"/></linearGradient></defs>
 <rect width="1400" height="430" rx="18" fill="url(#bg)"/><rect width="1400" height="430" rx="18" fill="url(#grid)"/>
 <g font-family="Arial, Helvetica, sans-serif"><text x="65" y="72" font-size="13" letter-spacing="4" fill="#9abcba">REPRODUCIBLE PROGNOSTICS</text><text x="60" y="162" font-size="78" font-weight="700" letter-spacing="-3" fill="#f4faf7">Steam<tspan fill="#97d9c6">Weave</tspan></text><text x="65" y="213" font-size="23" fill="#c7dbd9">Maintenance-aware multimodal evidence.</text><text x="65" y="247" font-size="23" fill="#c7dbd9">Forecasts you can inspect and reproduce.</text>
 <g transform="translate(65 303)" font-size="12" letter-spacing="1"><rect width="154" height="33" rx="5" fill="#244851"/><text x="14" y="21" fill="#b5d3cc">7 AGENT ROLES</text><rect x="168" width="205" height="33" rx="5" fill="#244851"/><text x="182" y="21" fill="#b5d3cc">PLUGGABLE LLM APIs</text><rect x="387" width="188" height="33" rx="5" fill="#244851"/><text x="401" y="21" fill="#b5d3cc">TRAJECTORY AUDIT</text></g>
 <g stroke="#77a7a8" stroke-width="1.5" fill="none" opacity=".7"><path d="M858 100 L1038 214 L858 329"/><path d="M1260 100 L1038 214 L1260 329"/></g>
 <g font-size="12" fill="#c4ddda" text-anchor="middle"><rect x="772" y="69" width="170" height="62" rx="8" fill="#244851" stroke="#466972"/><text x="857" y="96">NUMERICAL</text><text x="857" y="115" fill="#8facae" font-size="10">horizon + cleaning history</text><rect x="772" y="298" width="170" height="62" rx="8" fill="#244851" stroke="#466972"/><text x="857" y="326">TEXTUAL</text><text x="857" y="345" fill="#8facae" font-size="10">evidence + freshness</text>
 <rect x="1171" y="69" width="170" height="62" rx="8" fill="#244851" stroke="#466972"/><text x="1256" y="96">VISUAL</text><text x="1256" y="115" fill="#8facae" font-size="10">curve + availability</text><rect x="1171" y="298" width="170" height="62" rx="8" fill="#244851" stroke="#466972"/><text x="1256" y="326">TEMPORAL</text><text x="1256" y="345" fill="#8facae" font-size="10">maintenance transitions</text>
 <circle cx="1040" cy="214" r="65" fill="#153940" stroke="#92ccb9" stroke-width="2"/><text x="1040" y="208" font-size="14" fill="#cfebdf">EVIDENCE</text><text x="1040" y="230" font-size="14" fill="#cfebdf">FUSION</text></g>
 <path d="M755 232 C790 185 820 189 847 228 S905 263 931 227" fill="none" stroke="url(#wave)" stroke-width="2.5" opacity=".8"/>
 <text x="65" y="393" fill="#75979b" font-size="11" letter-spacing="1.3">TIME-CONSCIOUS INPUTS  /  GROUPED EVALUATION  /  TRACEABLE OUTPUTS</text></g>
